apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-index-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.searchIndexService.replicas }}
  selector:
    matchLabels:
      app: search-index-service
  template:
    metadata:
      labels:
        app: search-index-service
    spec:
      containers:
        - name: search-index-service
          image: "{{ .Values.searchIndexService.image }}:{{ .Values.searchIndexService.tag }}"
          ports:
            - containerPort: {{ .Values.searchIndexService.port }}
          resources:
            requests:
              cpu: {{ .Values.searchIndexService.resources.requests.cpu }}
              memory: {{ .Values.searchIndexService.resources.requests.memory }}
            limits:
              cpu: {{ .Values.searchIndexService.resources.limits.cpu }}
              memory: {{ .Values.searchIndexService.resources.limits.memory }}
          env:
            - name: DB_HOST
              value: "postgres-search"
            - name: DB_USER
              value: "postgres"
            - name: DB_NAME
              value: "search_db"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: search-index-secret
                  key: DB_PASSWORD
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.searchIndexService.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/ready
              port: {{ .Values.searchIndexService.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: search-index-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: search-index-service
  ports:
    - port: {{ .Values.searchIndexService.port }}
      targetPort: {{ .Values.searchIndexService.port }}
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: search-index-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.postgres.searchPassword }}
