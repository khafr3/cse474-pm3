name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  COMMENTS_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/comments-service
  SEARCH_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/search-index-service

jobs:
  comments-ci:
    name: Comments Service CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/comments
    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4
      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 3. Install dependencies
        run: npm install
      - name: 4. Run tests with coverage
        run: npm test -- --ci --coverage --coverageDirectory=tests/coverage
      - name: 5. Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: comments-coverage
          path: services/comments/tests/coverage/
      - name: 6. Build Docker image
        run: docker build -t ${{ env.COMMENTS_IMAGE }}:${{ github.sha }} .
      - name: 7. Login to DockerHub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 8. Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.COMMENTS_IMAGE }}:${{ github.sha }}
          docker tag ${{ env.COMMENTS_IMAGE }}:${{ github.sha }} ${{ env.COMMENTS_IMAGE }}:latest
          docker push ${{ env.COMMENTS_IMAGE }}:latest

  search-ci:
    name: Search Index Service CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/search-index
    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4
      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 3. Install dependencies
        run: npm install
      - name: 4. Run tests with coverage
        run: npm test -- --ci --coverage --coverageDirectory=tests/coverage
      - name: 5. Upload coverage report
        uses: actions/upload-artifact@v4
        with: