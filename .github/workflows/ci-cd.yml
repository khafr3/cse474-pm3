name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  COMMENTS_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/comments-service
  SEARCH_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/search-index-service

jobs:
  comments-ci:
    name: Comments Service CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/comments
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test -- --ci --coverage --coverageDirectory=tests/coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: comments-coverage
          path: services/comments/tests/coverage/
      - name: Build Docker image
        run: docker build -t ${{ env.COMMENTS_IMAGE }}:${{ github.sha }} .
      - name: Login to DockerHub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.COMMENTS_IMAGE }}:${{ github.sha }}
          docker tag ${{ env.COMMENTS_IMAGE }}:${{ github.sha }} ${{ env.COMMENTS_IMAGE }}:latest
          docker push ${{ env.COMMENTS_IMAGE }}:latest

  search-ci:
    name: Search Index Service CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/search-index
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test -- --ci --coverage --coverageDirectory=tests/coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: search-coverage
          path: services/search-index/tests/coverage/
      - name: Build Docker image
        run: docker build -t ${{ env.SEARCH_IMAGE }}:${{ github.sha }} .
      - name: Login to DockerHub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.SEARCH_IMAGE }}:${{ github.sha }}
          docker tag ${{ env.SEARCH_IMAGE }}:${{ github.sha }} ${{ env.SEARCH_IMAGE }}:latest
          docker push ${{ env.SEARCH_IMAGE }}:latest

  deploy:
    name: Deploy with Helm
    runs-on: ubuntu-latest
    needs: [comments-ci, search-ci]
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
      - name: