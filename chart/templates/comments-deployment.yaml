apiVersion: apps/v1
kind: Deployment
metadata:
  name: comments-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.commentsService.replicas }}
  selector:
    matchLabels:
      app: comments-service
  template:
    metadata:
      labels:
        app: comments-service
    spec:
      containers:
        - name: comments-service
          image: "{{ .Values.commentsService.image }}:{{ .Values.commentsService.tag }}"
          ports:
            - containerPort: {{ .Values.commentsService.port }}
          resources:
            requests:
              cpu: {{ .Values.commentsService.resources.requests.cpu }}
              memory: {{ .Values.commentsService.resources.requests.memory }}
            limits:
              cpu: {{ .Values.commentsService.resources.limits.cpu }}
              memory: {{ .Values.commentsService.resources.limits.memory }}
          env:
            - name: DB_HOST
              value: "postgres-comments"
            - name: DB_USER
              value: "postgres"
            - name: DB_NAME
              value: "comments_db"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comments-secret
                  key: DB_PASSWORD
            - name: SEARCH_SERVICE_URL
              value: "http://search-index-service:{{ .Values.searchIndexService.port }}"
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.commentsService.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/ready
              port: {{ .Values.commentsService.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: comments-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: comments-service
  ports:
    - port: {{ .Values.commentsService.port }}
      targetPort: {{ .Values.commentsService.port }}
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: comments-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.postgres.commentsPassword }}
