global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'comments-service'
    static_configs:
      - targets: ['comments-service:4000']
    metrics_path: /metrics

  - job_name: 'search-index-service'
    static_configs:
      - targets: ['search-index-service:4001']
    metrics_path: /metrics

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
